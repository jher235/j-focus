name: auto-generate-pr-to-develop.yml

on:
  push:
    # main과 develop 브랜치를 제외한 모든 브랜치에 push될 때 실행
    branches-ignore:
      - main
      - develop

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Check if PR already exists
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          
          # 현재 브랜치에서 develop으로 가는 PR이 이미 있는지 확인
          EXISTING_PR=$(gh pr list --head ${{ github.ref_name }} --base develop --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "PR already exists: #$EXISTING_PR"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Get Context (Commits & Diff)
        if: steps.check_pr.outputs.exists == 'false'
        id: get-context
        run: |
          
          # develop 브랜치와의 차이점(Diff)과 커밋 메시지 추출
          # origin/develop이 없는 경우를 대비해 fetch 실행
          git fetch origin develop
          DIFF=$(git diff origin/develop...HEAD)
          COMMITS=$(git log origin/develop...HEAD --pretty=format:"- %s")
          
          echo "diff<<EOF" >> $GITHUB_ENV
          echo "${DIFF:0:5000}" 
          echo "EOF" >> $GITHUB_ENV
          
          echo "commits<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate PR Content with Gemini
        if: steps.check_pr.outputs.exists == 'false'
        id: gemini
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prompt = `
              You are an expert software engineer. Based on the commit messages and code diff below, 
              write a PR title and body in professional English.

              Structure the body exactly as follows:
              ## 📝 Description
              (A concise summary of what this PR is about)

              ## ❓ Why is this change required?
              (Motivation behind this change)

              ## ✨ What does this PR do?
              (Key technical changes in bullet points)

              Context:
              - Commits: ${process.env.commits}
              - Diff: ${process.env.diff}

              Response Format:
              TITLE: [The PR Title]
              BODY: [The PR Body]
            `;

            const apiKey = process.env.GEMINI_API_KEY;
            const apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey;
            
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.2 }
              })
            });

            const result = await response.json();
            const aiResponse = result.candidates[0].content.parts[0].text;
            
            // 제목과 본문 파싱
            const titleMatch = aiResponse.match(/TITLE: (.*)/);
            const bodyMatch = aiResponse.split('BODY:')[1];
            
            const title = titleMatch ? titleMatch[1].trim() : "Update from " + process.env.GITHUB_REF_NAME;
            const body = bodyMatch ? bodyMatch.trim() : "No description generated.";
            
            core.setOutput('title', title);
            core.setOutput('body', body);
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Pull Request
        if: steps.check_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head ${{ github.ref_name }} \
            --title "${{ steps.gemini.outputs.title }}" \
            --body "${{ steps.gemini.outputs.body }}" \
            --assignee ${{ github.actor }}